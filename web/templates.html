<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Templates · Outreach CRM</title>
<link rel="stylesheet" href="style.css?v=20261120b">
<style>
  .tpl{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
  .tpl .th{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .tpl .tn{font-weight:600;font-size:15px}
  .tpl .ts{font-size:13px;color:var(--text-2);margin-bottom:10px}
  .tpl pre{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:16px;
    font-family:inherit;font-size:13px;white-space:pre-wrap;line-height:1.6;color:var(--text)}
  .copybtn{background:var(--accent);color:#fff;border:none;padding:6px 13px;border-radius:8px;font-size:12px;cursor:pointer;font-weight:500}
</style>
</head>
<body>
<div class="layout">
  <div id="nav"></div>
  <div class="main">
    <header class="pg"><h1>Templates</h1><p>Your reusable email templates.</p></header>
    <div id="list"></div>
    <div class="foot">Tip: ask your assistant to "add a new template" anytime.</div>
  </div>
</div>
<script src="app.js?v=20261120b"></script>
<script>
document.getElementById("nav").outerHTML = renderNav("templates.html");
const TEMPLATES = [
  { name:"Cold outreach (recruiter)", subject:"Ex-Groww growth intern → [Company]?",
    body:`Hi [Name] ma'am/sir,\n\nI'm Priyanshu, a final-year student at RVCE and ex-Growth Intern at Groww (growth marketing, user acquisition, analytics).\n\nI'm looking for growth/marketing roles and would love to connect about any openings at [Company].\n\nI know your calendar's super busy - could I grab a quick slot of your time? → https://calendar.app.google/VWSPymrNrEKZpDyH7\n\nThanks,\nPriyanshu` },
  { name:"Follow-up (no reply)", subject:"Re: quick chat about growth roles at [Company]",
    body:`Hi [Name],\n\nJust following up on my earlier note. I know your calendar's super busy, so no pressure, but I'd still love to connect about any growth/marketing openings at [Company].\n\nIf a quick 15 min works: https://calendar.app.google/VWSPymrNrEKZpDyH7\n\nThanks,\nPriyanshu` },
  { name:"Thank-you (after call)", subject:"Thanks for your time today",
    body:`Hi [Name],\n\nThank you for taking the time to chat today - I really enjoyed learning about [Company] and the team.\n\nI'm excited about the possibility of contributing to your growth efforts. Please let me know if there's anything else I can share.\n\nBest,\nPriyanshu` },
];
document.getElementById("list").innerHTML = TEMPLATES.map((t,i)=>`
  <div class="tpl">
    <div class="th"><div class="tn">${t.name}</div><button class="copybtn" data-i="${i}">Copy</button></div>
    <div class="ts"><b>Subject:</b> ${t.subject}</div>
    <pre id="tpl${i}">${t.body}</pre>
  </div>`).join("");
document.querySelectorAll(".copybtn").forEach(b=>b.addEventListener("click",()=>{
  const t = TEMPLATES[b.dataset.i];
  navigator.clipboard.writeText("Subject: "+t.subject+"\n\n"+t.body);
  b.textContent="Copied ✓"; setTimeout(()=>b.textContent="Copy",1500);
}));
</script>
</body>
</html>
