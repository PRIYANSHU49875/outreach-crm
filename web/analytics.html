<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analytics · Outreach CRM</title>
<link rel="stylesheet" href="style.css?v=20261120b">
<style>
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
  @media(max-width:800px){.grid2{grid-template-columns:1fr}}
  .box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
  .box .cap{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);font-weight:600;margin-bottom:16px}
  .bar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .bar .bl{width:120px;font-size:13px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .bt{flex:1;background:var(--bg);border-radius:6px;height:26px;overflow:hidden}
  .bar .bf{height:100%;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding:0 8px;color:#fff;font-size:12px;font-weight:600;transition:width .8s}
  .big-metric{text-align:center;padding:10px 0}
  .big-metric .n{font-size:40px;font-weight:700;letter-spacing:-.03em}
  .big-metric .l{color:var(--text-3);font-size:13px;margin-top:4px}
</style>
</head>
<body>
<div class="layout">
  <div id="nav"></div>
  <div class="main">
    <header class="pg"><h1>Analytics</h1><p>What's working in your outreach.</p></header>
    <div id="errBox"></div>
    <div class="stats" id="stats"></div>
    <div class="grid2">
      <div class="box"><div class="cap">Funnel</div><div id="funnel"></div></div>
      <div class="box"><div class="cap">Emails by Type</div><div id="byType"></div></div>
    </div>
    <div class="box"><div class="cap">Subject Lines Used</div><div id="bySubject"></div></div>
    <div class="foot">More data = sharper insights. Keep sending.</div>
  </div>
</div>
<script src="app.js?v=20261120b"></script>
<script>
document.getElementById("nav").outerHTML = renderNav("analytics.html");
function bars(obj, max){
  const m = Math.max(max||Math.max(...Object.values(obj),1),1);
  return Object.entries(obj).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
    <div class="bar"><span class="bl" title="${k}">${k||"(none)"}</span>
      <div class="bt"><div class="bf" style="width:0" data-w="${Math.max(v/m*100,10)}">${v}</div></div></div>`).join("");
}
function renderPage(d){
  const s = stats(d);
  const a = d.analytics||{};
  document.getElementById("stats").innerHTML = [
    [s.sent,"Sent"],[s.replied,"Replies"],[s.booked,"Booked"],[s.rate+"%","Reply Rate"]
  ].map(x=>`<div class="stat"><div class="num">${x[0]}</div><div class="lbl">${x[1]}</div></div>`).join("");

  const f = a.funnel||{sent:s.sent,replied:s.replied,booked:s.booked};
  document.getElementById("funnel").innerHTML = bars({Sent:f.sent,Replied:f.replied,Booked:f.booked}, f.sent);
  document.getElementById("byType").innerHTML = Object.keys(a.byType||{}).length ? bars(a.byType) : '<p class="empty" style="padding:4px 0">No data yet.</p>';
  const subs = {}; Object.entries(a.bySubject||{}).forEach(([k,v])=>subs[k]=v.sent);
  document.getElementById("bySubject").innerHTML = Object.keys(subs).length ? bars(subs) : '<p class="empty" style="padding:4px 0">No data yet.</p>';
  setTimeout(()=>document.querySelectorAll('.bf').forEach(b=>b.style.width=b.dataset.w+"%"),150);
}
loadData().then(renderPage).catch(e=>{document.getElementById("errBox").innerHTML='<div class="err">Could not load data.</div>';});
window.DASH.startAutoRefresh(renderPage);
</script>
</body>
</html>
