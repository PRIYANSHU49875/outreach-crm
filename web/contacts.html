<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contacts · Outreach CRM</title>
<link rel="stylesheet" href="style.css?v=20261120b">
<style>.search{width:100%;max-width:340px;padding:10px 13px;border:1px solid #cdd5de;border-radius:8px;font-size:14px;margin-bottom:16px;outline:none}
.search:focus{border-color:#3e6ae1}</style>
</head>
<body>
<div class="layout">
  <div id="nav"></div>
  <div class="main">
    <header class="pg"><h1>Contacts</h1><p>Recruiters &amp; people you've reached out to.</p></header>
    <div id="errBox"></div>
    <div class="stats" id="stats"></div>
    <input class="search" id="search" placeholder="Search name, email, company or status…">
    <table>
      <thead><tr><th>Name</th><th>Email</th><th>Company</th><th>Role</th><th>Date Emailed</th><th>Status</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="foot">Served locally · Auto-refreshes.</div>
  </div>
</div>
<script src="app.js?v=20261120b"></script>
<script>
document.getElementById("nav").outerHTML = renderNav("contacts.html");
let ALL = [];
function statusTag(s){
  var cls = "";
  if(/replied/i.test(s)) cls="ok";
  else if(/booked/i.test(s)) cls="ok";
  else if(/no response|not interested/i.test(s)) cls="wait";
  return `<span class="tag ${cls}">${s||"—"}</span>`;
}
function draw(list){
  document.getElementById("rows").innerHTML = list.map(c=>`<tr>
    <td>${c.name||"—"}</td><td class="email">${c.email||"—"}</td>
    <td>${c.company||"—"}</td><td>${c.role||"—"}</td>
    <td class="email">${c.dateEmailed||"—"}</td><td>${statusTag(c.status)}</td>
  </tr>`).join("") || '<tr><td colspan="6" class="empty">No contacts yet. Paste a recruiter list to your assistant to add them.</td></tr>';
}
function renderPage(d){
  ALL = d.contacts||[];
  const total = ALL.length;
  const replied = ALL.filter(c=>/replied|booked/i.test(c.status)).length;
  const emailed = ALL.filter(c=>/emailed/i.test(c.status)).length;
  document.getElementById("stats").innerHTML = [
    [total,"Total Contacts"],[emailed,"Emailed"],[replied,"Replied / Booked"]
  ].map(x=>`<div class="stat"><div class="num">${x[0]}</div><div class="lbl">${x[1]}</div></div>`).join("");
  applySearch();
}
function applySearch(){
  const q=document.getElementById("search").value.toLowerCase();
  draw(ALL.filter(c=>(`${c.name} ${c.email} ${c.company} ${c.role} ${c.status}`).toLowerCase().includes(q)));
}
loadData().then(d=>{ renderPage(d);
  document.getElementById("search").addEventListener("input",applySearch);
}).catch(e=>{
  document.getElementById("errBox").innerHTML='<div class="err">Could not load data ('+e.message+'). Make sure the live server is running.</div>';
});
window.DASH.startAutoRefresh(renderPage);
</script>
</body>
</html>
